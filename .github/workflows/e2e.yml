# E2E con Playwright contra una Supabase LOCAL en Docker (nunca la nube).
# Por ahora solo se corre a mano (Actions → E2E → Run workflow): se alcanzó el límite de minutos
# de GitHub Actions. Para correrlo en cada PR, agregar `pull_request:` en `on:`.
name: E2E

on:
  workflow_dispatch:

jobs:
  # Las claves salen de `supabase status`: son las de demostración del CLI, no secretos.
  # Este job no lee secrets.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: Levantar Supabase local
        run: npx supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Esquema y semilla
        run: |
          npx supabase db reset
          npm run db:sembrar

      - name: Pruebas E2E
        run: npm run test:e2e

      - name: Subir reporte si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
